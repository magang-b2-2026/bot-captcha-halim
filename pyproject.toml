[project]
name = "komdigi-bot"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.40",
    "pydantic>=2",
    "pydantic-settings>=2",
    "python-dotenv>=1",
    "httpx>=0.27",
    "pyyaml>=6",
    "typing-extensions>=4.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "basedpyright>=1.18",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# S110/S112: try-except-pass/continue are intentional best-effort fallbacks in Playwright helpers
# BLE001: broad exception catches keep the bot running on unexpected Playwright errors
# SLF001: accessing _vision_model/_reasoning_model for evidence/logging is intentional
per-file-ignores = { "src/komdigi_bot/solvers/*.py" = ["S110", "S112", "BLE001", "SLF001"] }

[tool.basedpyright]
include = ["src", "tests"]
exclude = ["vendor-reference", ".venv", "outputs"]

[[tool.basedpyright.executionEnvironments]]
root = "tests"
reportAny = false
reportPrivateUsage = false
reportUnusedCallResult = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/komdigi_bot"]
