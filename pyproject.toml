[project]
name = "komdigi-bot"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.40",
    "pydantic>=2",
    "pydantic-settings>=2",
    "python-dotenv>=1",
    "httpx>=0.27",
    "pyyaml>=6",
    "typing-extensions>=4.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "basedpyright>=1.18",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.basedpyright]
include = ["src", "tests"]
exclude = ["vendor-reference", ".venv", "outputs"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/komdigi_bot"]
